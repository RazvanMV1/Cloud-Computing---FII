version: '3.8'

services:
  db:
    image: postgres:15
    container_name: university_db
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d university"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: university_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: university
      DB_USER: admin
      DB_PASSWORD: admin123

volumes:
  postgres_data:
